<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#06b6d4" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Outer Pulse Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#0e7490" stroke-width="3" stroke-dasharray="16 12" opacity="0.6" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#primaryGrad)" stroke-width="4" opacity="0.3" />

  <!-- Shield / Aura Badge -->
  <circle cx="256" cy="256" r="110" fill="#0b1120" stroke="url(#primaryGrad)" stroke-width="6" filter="url(#neonGlow)" />

  <!-- Modern Bluetooth Rune / Earbud Symbol -->
  <path d="M 230 160 L 230 352 M 230 160 L 285 208 L 230 256 L 285 304 L 230 352" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Left / Right Audio Waves -->
  <path d="M 175 220 A 40 40 0 0 0 175 292" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.8" />
  <path d="M 150 200 A 70 70 0 0 0 150 312" fill="none" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" opacity="0.5" />
  
  <path d="M 337 220 A 40 40 0 0 1 337 292" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.8" />
  <path d="M 362 200 A 70 70 0 0 1 362 312" fill="none" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" opacity="0.5" />

  <!-- Status Indicator Dot (Cyan pulse) -->
  <circle cx="256" cy="405" r="10" fill="#06b6d4" />
  <circle cx="256" cy="405" r="16" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.6" />
</svg>
